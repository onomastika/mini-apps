name: Wingspan studio acceptance
on:
  push:
    branches: [wingspan-studio-check-20261126]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium --with-deps
      - run: |
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          node .github/studio-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-visual
          path: evidence/
          retention-days: 3
