name: Wingspan V11 candidate training
on:
  push:
    branches: [wingspan/v11-strategy]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wingspan/strategy-v11.cjs
      - run: npm install --no-save playwright-core@1.55.0
      - run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          timeout 300s node tests/wingspan/browser-v11.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-browser
          path: evidence/
          retention-days: 3
  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [standard,strong]
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p results
          node tests/wingspan/competitive-v11.cjs ${{ matrix.shard }} 3 ${{ matrix.suite }} training > results/${{ matrix.suite }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v11-training-${{ matrix.suite }}-${{ matrix.shard }}
          path: results/
          retention-days: 3
  select:
    needs: training
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v11-training-*
          path: results
          merge-multiple: true
      - run: |
          node - <<'NODE'
          const fs=require('fs'),m={standard:{},strong:{}};
          for(const f of fs.readdirSync('results'))for(const a of JSON.parse(fs.readFileSync('results/'+f)))(m[f.split('-')[0]][a.version]??=[]).push(...a.cases);
          const ranked=[111,112,113].map(v=>{let suites={};for(let [s,a] of Object.entries(m)){if(a[v].length!==12||a[10].length!==12)throw Error('missing games');let old=new Map(a[10].map(c=>[c.seed,c]));if(a[v].some(c=>c.turns!==26||c.decisions!==26||!old.has(c.seed)))throw Error('invalid cases');let avg=(a,k)=>a.reduce((n,c)=>n+c[k],0)/a.length;suites[s]={delta:avg(a[v].map(c=>({d:c.score-old.get(c.seed).score})),'d'),winDelta:avg(a[v],'win')-avg(a[10],'win'),ms:avg(a[v],'ms')/26,baselineMs:avg(a[10],'ms')/26,fallbacks:a[v].reduce((s,c)=>s+c.fallbacks,0)}}return {variant:v-110,suites,utility:(suites.standard.delta+suites.strong.delta)/2}}).sort((a,b)=>b.utility-a.utility);
          const winner=ranked.find(v=>v.utility>0&&v.suites.strong.delta>=0&&v.suites.standard.delta>=0&&v.suites.strong.fallbacks===0&&v.suites.standard.fallbacks===0)||null;
          console.log('TRAINING SELECTION',JSON.stringify({winner,ranked}));fs.writeFileSync('selection.json',JSON.stringify({winner,ranked},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v11-training-selection
          path: selection.json
          retention-days: 3
