name: Wingspan V7 acceptance
on:
  push:
    branches: [wingspan-v7-browser-20261126]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wingspan/strategy-v7.cjs
      - run: npm install --no-save playwright-core@1.55.0
      - run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          timeout 240s node .github/wingspan-v7-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wingspan-v7-evidence
          path: evidence/
          retention-days: 3
