name: Wingspan V12 focused acceptance
on:
  push:
    branches: [wingspan/v12-strategy]
permissions:
  contents: read
jobs:
  compare:
    if: ${{ !contains(github.event.head_commit.message, 'browser-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [base, base-strong, oceania, oceania-strong]
        chunk: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wingspan/competitive-v12.cjs ${{ matrix.mode }} ${{ matrix.chunk }}
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wingspan/strategy-v12.cjs
      - name: Verify released V11 asset bytes
        run: |
          git fetch --depth=1 origin 3f6d8d4622cad5fd456ca505c28171bcc6baf667
          for file in index.html cards.json; do
            git show 3f6d8d4622cad5fd456ca505c28171bcc6baf667:public/wingspan/$file > /tmp/expected-$file
            curl -fsSL --retry 2 "https://mini-apps.rossthiof.workers.dev/wingspan/$file?verify=3f6d8d4" > /tmp/live-$file
            cmp /tmp/expected-$file /tmp/live-$file
            sha256sum /tmp/live-$file
          done
        continue-on-error: true
      - run: npm install --no-save playwright-core@1.55.0
      - run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          python3 -m http.server 8765 --directory public >/tmp/server.log 2>&1 &
          timeout 240s node tests/wingspan/browser-v12.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wingspan-v12-browser
          path: evidence/
          retention-days: 3
