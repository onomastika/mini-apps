name: Wingspan visual smoke
on:
  push:
    branches: [wingspan-art-check-20261125]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium --with-deps
      - run: |
          python3 -m http.server 8765 --directory public >/tmp/wingspan-server.log 2>&1 &
          node .github/wingspan-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wingspan-visual-evidence
          path: evidence/
          retention-days: 3
