name: Wingspan V5 production verification
on:
  push:
    branches: [wingspan-v5-check-20261126]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify published HTML and catalog against accepted files
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://mini-apps.rossthiof.workers.dev/wingspan/cards.json?verify=v5-$attempt" -o /tmp/live-wingspan.json || true
            curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://mini-apps.rossthiof.workers.dev/wingspan/?verify=v5-$attempt" -o /tmp/live-wingspan.html || true
            if cmp -s /tmp/live-wingspan.json public/wingspan/cards.json && cmp -s /tmp/live-wingspan.html public/wingspan/index.html; then
              echo 'PRODUCTION V5 MATCH: HTML + catalog'
              exit 0
            fi
            sleep 5
          done
          echo 'Production not yet identical to accepted V5'
          exit 1
