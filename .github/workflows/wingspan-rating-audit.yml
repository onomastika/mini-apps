name: Wingspan rating audit acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/wingspan/**'
      - 'tests/wingspan/**'
      - '.github/workflows/wingspan-rating-audit.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wingspan/strategic-value.cjs
      - run: node --check tests/wingspan/strategic-rating-audit.cjs
      - run: node tests/wingspan/strategic-rating-audit.cjs 312400 1 base /tmp/audit.json 2
      - run: node tests/wingspan/strategic-rating-audit.cjs 313400 1 oceania /tmp/audit-oceania.json 2
      - run: node tests/wingspan/strategic-rating-audit.cjs 312400 1 base /tmp/audit-goal-aware.json 2 goal-aware goal-aware
      - run: node -e "const assert=require('node:assert/strict'),a=require('./tests/wingspan/strategic-rating-audit.cjs'); assert.equal(a.pairedGapSE({lossSamples:[2,4,6]},{lossSamples:[1,3,5]}),0); const p=require('/tmp/audit-goal-aware.json'); assert.equal(p.length,4); assert(p.every(x=>x.policy==='goal-aware'&&x.cards.every(c=>c.lossSamples.length===2)));"
      - run: npm install --no-save playwright-core@1.55.0
      - name: Check mobile layout and scroll
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8765 --directory public >/tmp/value-server.log 2>&1 &
          timeout 180s node tests/wingspan/browser-strategic-value.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wingspan-rating-audit-browser
          path: evidence/
          retention-days: 7

  production-base:
    # On audit-only PRs verify the already merged safety fix against live bytes.
    if: github.head_ref == 'wingspan/strategic-rating-audit-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 101541f507030841fca8438ba9e3f043f5d9fbc4
      - name: Verify production bytes of merged safety revision
        run: |
          set -euo pipefail
          root=https://mini-apps.rossthiof.workers.dev/wingspan
          for file in index.html cards.json visual-studio.css visual-studio.js; do
            curl -fsSL --retry 2 --max-time 15 "$root/$file?revision=101541f507030841fca8438ba9e3f043f5d9fbc4" -o "/tmp/live-$file"
            cmp "public/wingspan/$file" "/tmp/live-$file"
            sha256sum "/tmp/live-$file"
          done
